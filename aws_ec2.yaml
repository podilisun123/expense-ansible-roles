plugin: amazon.aws.aws_ec2
regions:
  - us-east-1

keyed_groups:
- key: tags['Name']
  prefix: ''
  parent_group: ''

filters:
  tag:Name: "Backend*"
  
compose:
  # Use the private IP address to connect to the host
  # (note: this does not modify inventory_hostname, which is set via I(hostnames))
  ansible_host: private_ip_address
